<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hlídači dat – hra o informačních systémech</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2370}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink);background:#e9ecff;background-image:radial-gradient(#cfd5ff 2px,transparent 2px);background-size:26px 26px;min-height:100vh}
.card{background:#fff;border:4px solid var(--ink);border-radius:1.5rem;box-shadow:0 6px 0 var(--ink)}
.btn{font-weight:700;border:4px solid var(--ink);border-radius:1rem;padding:.65rem 1.2rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;background:#ffd23f;color:var(--ink);cursor:pointer}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.cell:focus-visible{outline:4px solid #ff5c7a;outline-offset:2px}
.good{background:#2ec4a0}.bad{background:#ff5c7a;color:#fff}.sky{background:#4cc9f0}
.pill{background:#ffd23f;border:3px solid var(--ink);border-radius:999px;padding:.15rem .9rem;font-weight:700}
.cell{border:3px solid var(--ink);border-radius:.7rem;height:44px;min-width:44px;background:#fff;font-size:1.2rem;cursor:pointer}
.cell.on{background:#b9f3e4}.cell.off{background:#ffe0e6}
.cell.wrong{box-shadow:0 0 0 4px #e11d48}
.cell.tried{opacity:.45}
.cell.bug{box-shadow:0 0 0 4px #2ec4a0;background:#b9f3e4}
.pop{animation:pop .35s ease-out}
.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.pop,.shake{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="fixed bottom-1 right-2 text-[10px] opacity-60 pointer-events-none">Vytvořeno pomocí AI</div>
<script>
const ROLES={admin:{n:'Ředitel',e:'🛡️',c:'#ff5c7a'},ucitel:{n:'Učitel',e:'🧑‍🏫',c:'#ffd23f'},rodic:{n:'Rodič',e:'👪',c:'#2ec4a0'},zak:{n:'Žák',e:'🎒',c:'#4cc9f0'}};
const RK=['admin','ucitel','rodic','zak'];
const ACTS=['📅 Měnit rozvrh','👀 Vidět rozvrh','📖 Číst známky','✏️ Zapisovat známky','🗑️ Mazat známky','📝 Psát omluvenky'];
const ACT_Q=['upravovat rozvrh','vidět rozvrh','číst známky','zapisovat známky','mazat známky','psát omluvenky'];
const M={admin:'AAANNN',ucitel:'NAAAAN',rodic:'NAANNA',zak:'NAANNN'};
const EXP=['Rozvrh upravuje jen ředitel.','Rozvrh si smí prohlédnout každý.','Známky smí číst každá role (ale vidí jen ty své).','Známky zapisuje jen učitel.','Známky maže jen učitel.','Omluvenky píše jen rodič.'];
const GOOD=['Správně! 🎉','Bomba! 🚀','Přesně tak! ⭐','Jsi hacker… ale hodný! 😎','Admin by byl pyšný! 🛡️'];
const BAD=['Ouha! 🙈','Au, to by byla chyba v systému! 🐛','Skoro! Příště to vyjde 💪','Tohle by ředitel nepodepsal 😅'];
const BUGS=[['zak',3,'Žák by si mohl sám zapsat samé jedničky! 😄'],['rodic',4,'Rodič by mohl smazat cizí známky – to je nebezpečné!'],['zak',5,'Omluvenky nepíše žák, jinak by se omlouval sám z každé hodiny.'],['ucitel',0,'Rozvrh má měnit jen ředitel, jinak by si ho každý přehazoval.'],['zak',4,'Žák by si mohl smazat své pětky! 🙊']];
const ES=[['Prohlížet zboží','🛍️','AAA'],['Zadat objednávku','🛒','ANN'],['Upravit stav skladu','📦','NAA'],['Měnit ceny','💶','NNA'],['Mazat objednávky','🗑️','NNA'],['Číst tržby firmy','📈','NNA']];
const ESR=['🧑‍💻 Zákazník','📦 Skladník','👑 Majitel'];
const GAMES=[['Kdo co může?','🎯','Rozhodni, jestli role smí provést akci.','sky'],['Najdi chybu!','🔍','V tabulce oprávnění se skrývá bezpečnostní díra.','bad'],['Nastav práva e-shopu','🛒','Nastav každé roli jen to, co opravdu potřebuje.','good']];

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
let S={score:0,pct:[0,0,0],pts:[0,0,0],screen:'intro'},G={};
const unlocked=i=>i==0||S.pct[i-1]>=.6;
const total=()=>S.pts.reduce((a,b)=>a+b,0);
function go(s){S.screen=s;render()}

function fb(ok,msg,exp,label,fn){return `<div class="mt-4 p-4 rounded-2xl border-4 border-[#2b2370] pop ${ok?'good':'bad'}" role="status"><div class="text-xl font-bold">${msg}</div><div class="mt-1 font-medium">${exp}</div><button class="btn mt-3" onclick="${fn}">${label}</button></div>`}

/* ---------- Úvod ---------- */
function intro(){return `<div class="card p-6 text-center">
<div class="text-6xl">🛡️</div>
<h1 class="text-3xl font-bold mt-2">Hlídači dat</h1>
<p class="mt-1 text-lg">Staň se správcem školního informačního systému!</p></div>
<div class="card p-5 mt-5"><h2 class="text-2xl font-bold">Co je informační systém?</h2>
<p class="mt-1">Soubor <b>technologií, dat a lidí</b>, který umí:</p>
<div class="grid sm:grid-cols-3 gap-3 mt-3 text-center">
<div class="p-3 rounded-2xl bg-[#d7f4ff] border-2 border-[#2b2370]"><div class="text-3xl">✍️</div><b>Sbírat data</b><br><span class="text-sm">zapisovat údaje</span></div>
<div class="p-3 rounded-2xl bg-[#fff3c4] border-2 border-[#2b2370]"><div class="text-3xl">🗄️</div><b>Ukládat a zpracovat</b><br><span class="text-sm">databáze, průměry</span></div>
<div class="p-3 rounded-2xl bg-[#c9f6ea] border-2 border-[#2b2370]"><div class="text-3xl">📣</div><b>Dávat informace</b><br><span class="text-sm">konkrétním lidem</span></div></div>
<p class="mt-3">Příklady: 🛒 e-shop, 📚 knihovní systém, 🏫 školní systém (Bakaláři).</p></div>
<div class="card p-5 mt-5"><h2 class="text-2xl font-bold">Role a práva</h2>
<p class="mt-1">Každý uživatel má <b>roli</b> a podle ní práva:</p>
<div class="flex flex-wrap gap-2 mt-3">${RK.map(r=>`<span class="pill" style="background:${ROLES[r].c}">${ROLES[r].e} ${ROLES[r].n}</span>`).join('')}</div>
<div class="grid grid-cols-3 gap-2 mt-3 text-center text-sm font-bold"><div class="p-2 rounded-xl bg-[#d7f4ff] border-2 border-[#2b2370]">👀 Čtení<br><span class="font-normal">jen koukám</span></div><div class="p-2 rounded-xl bg-[#fff3c4] border-2 border-[#2b2370]">✏️ Zápis<br><span class="font-normal">vkládám a měním</span></div><div class="p-2 rounded-xl bg-[#ffe0e6] border-2 border-[#2b2370]">🗑️ Mazání<br><span class="font-normal">odstraňuji</span></div></div>
<div class="mt-4 p-3 rounded-2xl bg-[#ffd23f] border-4 border-[#2b2370] font-semibold">⭐ Zásada minimálních oprávnění: uživatel má jen taková práva, která nezbytně potřebuje – a ani o trochu víc.</div></div>
<div class="text-center mt-6"><button class="btn text-xl good" onclick="go('menu')">Začít hru 🚀</button></div>`}

/* ---------- Menu ---------- */
function menu(){const all=S.pts.every(p=>p>0);
return `<h2 class="text-3xl font-bold text-center">Vyber úkol</h2><p class="text-center">Aby se odemkl další úkol, získej aspoň 60 % bodů.</p>
<div class="grid gap-4 mt-4">${GAMES.map((g,i)=>{const u=unlocked(i);return `<button ${u?'':'disabled'} onclick="start${i+1}()" class="card p-4 text-left flex items-center gap-4 ${u?'':'opacity-60'}" style="cursor:${u?'pointer':'not-allowed'}">
<div class="text-4xl w-16 h-16 rounded-2xl border-4 border-[#2b2370] flex items-center justify-center ${g[3]}">${u?g[1]:'🔒'}</div>
<div class="flex-1"><div class="text-xl font-bold">Úkol ${i+1}: ${g[0]}</div><div class="text-sm">${u?g[2]:'Zamčeno – dokonči předchozí úkol.'}</div></div>
<div class="text-sm font-bold">${S.pts[i]>0?'⭐ '+S.pts[i]+' b.':''}</div></button>`}).join('')}</div>
${all?`<div class="text-center mt-6"><button class="btn good text-lg" onclick="go('end')">Ukázat vysvědčení 🏆</button></div>`:''}`}

/* ---------- Výsledek úkolu ---------- */
function finish(i,pts,max){S.pts[i]=Math.max(S.pts[i],pts);S.pct[i]=Math.max(S.pct[i],pts/max);G={done:i,pts,max};go('res')}
function res(){const i=G.done,p=G.pts/G.max,ok=p>=.6,last=i==2;
return `<div class="card p-6 text-center pop"><div class="text-6xl">${p>=.9?'🏆':ok?'🎉':'🤔'}</div>
<h2 class="text-3xl font-bold mt-2">${p>=.9?'Perfektní!':ok?'Dobrá práce!':'Zkus to znovu'}</h2>
<p class="text-xl mt-1">Získal(a) jsi <b>${G.pts}</b> z ${G.max} bodů.</p>
<p class="mt-2">${ok?(last?'Všechny úkoly máš splněné!':'Další úkol je odemčený! 🔓'):'Na odemknutí dalšího úkolu potřebuješ aspoň 60 %.'}</p>
<div class="flex flex-wrap gap-3 justify-center mt-4"><button class="btn sky" onclick="start${i+1}()">Hrát znovu 🔁</button>
${ok&&!last?`<button class="btn good" onclick="start${i+2}()">Další úkol ➡️</button>`:''}
${ok&&last?`<button class="btn good" onclick="go('end')">Vysvědčení 🏆</button>`:''}
<button class="btn" onclick="go('menu')">Menu</button></div></div>`}

/* ---------- Hra 1 ---------- */
function start1(){const all=[];RK.forEach(r=>ACT_Q.forEach((a,c)=>all.push([r,c])));G={q:shuf(all).slice(0,10),i:0,ok:0,a:null};go('g1')}
function g1(){const [r,c]=G.q[G.i],R=ROLES[r],yes=M[r][c]=='A';
return `<div class="flex justify-between font-bold"><span>Otázka ${G.i+1} / 10</span><span>✅ ${G.ok}</span></div>
<div class="h-4 rounded-full border-4 border-[#2b2370] bg-white mt-1 overflow-hidden"><div class="h-full good" style="width:${G.i*10}%"></div></div>
<div class="card p-6 mt-4 text-center"><div class="text-6xl w-24 h-24 mx-auto rounded-full border-4 border-[#2b2370] flex items-center justify-center" style="background:${R.c}">${R.e}</div>
<div class="text-2xl font-bold mt-3">${R.n}</div><p class="text-xl mt-2">Smí v systému <b>${ACT_Q[c]}</b>?</p>
<div class="grid grid-cols-2 gap-3 mt-4"><button class="btn good text-lg" ${G.a!==null?'disabled':''} onclick="ans1(true)">✅ Smí</button><button class="btn bad text-lg" ${G.a!==null?'disabled':''} onclick="ans1(false)">❌ Nesmí</button></div>
${G.a!==null?fb(G.a,pick(G.a?GOOD:BAD),(yes?'Smí. ':'Nesmí. ')+EXP[c],G.i==9?'Hotovo ➡️':'Další ➡️','next1()'):''}</div>`}
function ans1(v){if(G.a!==null)return;const [r,c]=G.q[G.i];G.a=(v===(M[r][c]=='A'));if(G.a)G.ok++;render()}
function next1(){G.i++;G.a=null;G.i>=10?finish(0,G.ok*10,100):render()}

/* ---------- Hra 2 ---------- */
function start2(){G={r:shuf(BUGS),i:0,tries:0,pts:0,done:false,msg:'',tried:{}};go('g2')}
function g2(){const b=G.r[G.i];
const rows=RK.map(r=>`<tr><td class="pr-2 py-1 font-bold whitespace-nowrap text-sm">${ROLES[r].e} ${ROLES[r].n}</td>${ACT_Q.map((_,c)=>{const v=(r==b[0]&&c==b[1])?'A':M[r][c];const k=r+c;const cls=(G.done&&r==b[0]&&c==b[1])?'bug':(G.tried[k]?'tried ':'')+(v=='A'?'on':'off');return `<td class="p-1"><button class="cell ${cls}" aria-label="${ROLES[r].n}: ${ACT_Q[c]}: ${v=='A'?'ano':'ne'}" ${G.done?'disabled':''} onclick="click2('${r}',${c})">${v=='A'?'✅':'🚫'}</button></td>`}).join('')}</tr>`).join('');
return `<div class="flex justify-between font-bold"><span>Tabulka ${G.i+1} / 5</span><span>⭐ ${G.pts} b.</span></div>
<div class="card p-4 mt-3"><p class="text-lg font-semibold">🕵️ Někdo udělal chybu a jedna role má <b>víc práv, než by měla</b>. Klikni na špatné políčko!</p>
<div class="overflow-x-auto mt-3"><table class="mx-auto"><thead><tr><th></th>${ACTS.map(a=>`<th class="text-[11px] leading-tight px-1 align-bottom">${a}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
<p class="text-sm mt-2">✅ = smí &nbsp; 🚫 = nesmí</p>
${G.msg&&!G.done?`<div class="mt-3 p-3 rounded-2xl border-4 border-[#2b2370] bad shake font-bold">${G.msg}</div>`:''}
${G.done?fb(true,pick(GOOD)+' +'+[20,10,5][Math.min(G.tries,2)]+' b.',b[2],G.i==4?'Hotovo ➡️':'Další tabulka ➡️','next2()'):''}</div>`}
function click2(r,c){if(G.done)return;const b=G.r[G.i];
if(r==b[0]&&c==b[1]){const p=[20,10,5][Math.min(G.tries,2)];G.pts+=p;G.done=true}
else{G.tries++;G.tried[r+c]=1;G.msg=pick(BAD)+' Tohle políčko je v pořádku.'+(G.tries>=2?` Tip: podívej se na řádek „${ROLES[b[0]].n}“.`:'')}
render()}
function next2(){G.i++;G.tries=0;G.done=false;G.msg='';G.tried={};G.i>=5?finish(1,G.pts,100):render()}

/* ---------- Hra 3 ---------- */
function start3(){G={g:ES.map(()=>[false,false,false]),att:0,msg:'',wrong:[]};go('g3')}
function g3(){
const rows=ES.map((e,r)=>`<tr><td class="pr-2 py-1 font-bold text-sm">${e[1]} ${e[0]}</td>${[0,1,2].map(c=>`<td class="p-1 text-center"><button class="cell ${G.g[r][c]?'on':'off'} ${G.wrong.includes(r+'-'+c)?'wrong':''}" aria-label="${e[0]}, ${ESR[c]}: ${G.g[r][c]?'smí':'nesmí'}" onclick="tog(${r},${c})">${G.g[r][c]?'✅':'🚫'}</button></td>`).join('')}</tr>`).join('');
return `<div class="card p-4"><p class="text-lg font-semibold">🏪 Nový e-shop potřebuje nastavit práva. Klikáním přepínej ✅ smí / 🚫 nesmí. Pamatuj: <b>jen to nejnutnější!</b></p>
<div class="overflow-x-auto mt-3"><table class="mx-auto"><thead><tr><th></th>${ESR.map(x=>`<th class="text-xs px-1">${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
<p class="text-sm mt-2">Tip: majitel obchod řídí, ale nenakupuje sám u sebe. Pokusů: ${G.att}</p>
${G.msg?`<div class="mt-3 p-3 rounded-2xl border-4 border-[#2b2370] bad shake font-bold">${G.msg}</div>`:''}
<div class="text-center mt-4"><button class="btn good text-lg" onclick="check3()">Zkontrolovat ✔️</button></div></div>`}
function tog(r,c){G.g[r][c]=!G.g[r][c];G.msg='';G.wrong=[];render()}
function check3(){const w=[];ES.forEach((e,r)=>[0,1,2].forEach(c=>{if((e[2][c]=='A')!==G.g[r][c])w.push(r+'-'+c)}));
if(!w.length){finish(2,[60,40,20][Math.min(G.att,2)],60);return}
G.att++;G.wrong=G.att>=2?w:[];G.msg=pick(BAD)+` Špatně je ${w.length} ${w.length==1?'políčko':w.length<5?'políčka':'políček'}. `+(G.att>=2?'Červeně jsou označené.':'Zkus to zkontrolovat – nemá někdo moc práv?');render()}

/* ---------- Vysvědčení ---------- */
function end(){const t=total(),title=t>=230?'Velmistr ochrany dat 🏆':t>=170?'Hlídač dat 🛡️':t>=100?'Učeň správce 🔧':'Začátečník 🌱';
return `<div class="card p-6 text-center pop"><div class="text-6xl">🎓</div><h2 class="text-3xl font-bold mt-2">Vysvědčení</h2>
<p class="mt-2 text-xl">Celkem bodů: <b>${t}</b> z 260</p><p class="text-2xl font-bold mt-1">${title}</p>
<div class="mt-4 p-3 rounded-2xl bg-[#ffd23f] border-4 border-[#2b2370] font-semibold text-left">⭐ Pamatuj si: každý má mít jen taková práva, která nezbytně potřebuje – kvůli <b>bezpečnosti</b>, <b>ochraně soukromí</b> a <b>přehlednosti</b>.</div>
<div class="flex flex-wrap gap-3 justify-center mt-5"><button class="btn sky" onclick="go('menu')">Zpět do menu</button></div></div>`}

/* ---------- Vykreslení ---------- */
const VIEWS={intro,menu,g1,g2,g3,res,end};
function render(){document.getElementById('app').innerHTML=`<header class="max-w-2xl mx-auto px-4 pt-4 flex items-center justify-between gap-2"><button class="text-xl font-bold" onclick="go('${S.screen=='intro'?'intro':'menu'}')">🛡️ Hlídači dat</button><div class="pill">⭐ ${total()}</div></header><main class="max-w-2xl mx-auto px-4 py-5 pb-12">${VIEWS[S.screen]()}</main>`;window.scrollTo({top:0})}
render();
</script>
</body>
</html>
